<circle cx="68" cy="42" r="7" fill="#FFBD2E"/>
<circle cx="92" cy="42" r="7" fill="#27C93F"/>
<text x="500" y="47" font-size="14" text-anchor="middle" fill="#787C99">astronomia-rag — python — 96×24</text>

<!-- conteúdo -->
<text x="44" y="100" font-size="15"><tspan fill="#7AA2F7">$</tspan><tspan fill="#C0CAF5"> python -m astronomia_rag.cli</tspan></text>

<text x="44" y="140" font-size="15" fill="#E0AF68">Astronomia RAG — pergunte sobre o céu (digite 'sair' para sair)</text>
