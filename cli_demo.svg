<text x="44" y="208" font-size="15"><tspan fill="#9ECE6A" font-weight="bold">Você:</tspan><tspan fill="#C0CAF5"> Por que sempre vemos a mesma face da Lua?</tspan></text>
<text x="44" y="240" font-size="15"><tspan fill="#BB9AF7" font-weight="bold">Bot:</tspan><tspan fill="#C0CAF5">  A rotação sincronizada da Lua faz com que sempre</tspan></text>
<text x="92" y="262" font-size="15" fill="#C0CAF5">vejamos a mesma face.</text>
