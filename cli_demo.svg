<text x="44" y="340" font-size="15"><tspan fill="#9ECE6A" font-weight="bold">Você:</tspan><tspan fill="#C0CAF5"> Qual a capital da França?</tspan></text>
<text x="44" y="372" font-size="15"><tspan fill="#BB9AF7" font-weight="bold">Bot:</tspan><tspan fill="#C0CAF5">  Não encontrei essa informação no meu material</tspan></text>
<text x="92" y="394" font-size="15" fill="#C0CAF5">sobre astronomia.</text>

